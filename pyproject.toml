[project]
name = "keepass-auto-merge"
version = "0.3.1"
description = "Merge KeePass sync-conflict databases into one master KDBX, non-destructively"
readme = "README.md"
authors = [
    { name = "willthong", email = "willthong@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tomli-w>=1.2.0",
]

[project.scripts]
keepass-auto-merge = "keepass_auto_merge.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-subprocess>=1.5",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
