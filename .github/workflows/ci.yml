name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: hooks and tests
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install KeePassXC (the merge engine)
        run: sudo apt-get update && sudo apt-get install -y keepassxc

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run the test suite
        run: uv run pytest -ra

  package:
    name: build and install the .deb
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build the .deb
        run: uv run python packaging/build_deb.py --dest dist

      - name: Install it on a clean runner
        run: sudo apt-get update && sudo apt-get install -y ./dist/keepass-auto-merge_*.deb

      - name: Smoke-test the installed CLI
        run: keepass-auto-merge --version

      - name: Remove it again
        run: sudo apt-get remove -y keepass-auto-merge

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
