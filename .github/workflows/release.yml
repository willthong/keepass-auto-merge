name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        run: |
          version="$(uv run python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Build the .deb
        run: uv run python packaging/build_deb.py --dest dist

      - name: Verify the built package installs and reports its version
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/keepass-auto-merge_*.deb
          keepass-auto-merge --version
          sudo apt-get remove -y keepass-auto-merge

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
